<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aplikasi Perhitungan Deposito Internal</title>
    <link rel="stylesheet" href="/src/style.css" />
    <!-- Open Graph Tags -->
    <meta property="og:title" content="Sistem Informasi Perhitungan deposito" />
    <meta
      property="og:description"
      content="Hitung deposito dengan mudah dan cepat."
    />
    <meta
      property="og:image"
      content="https://aplikasi-perhitungan-deposito.vercel.app/logo.jpg"
    />
    <meta
      property="og:url"
      content="https://aplikasi-perhitungan-deposito.vercel.app/"
    />
    <meta property="og:type" content="website" />

    <!-- Untuk WhatsApp & Mobile -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Sistem Informasi Perhitungan Deposito"
    />
    <meta
      name="twitter:description"
      content="Hitung Deposito dengan mudah dan cepat."
    />
    <meta
      name="twitter:image"
      content="https://aplikasi-perhitungan-deposito.vercel.app/og-image.jpg"
    />
  </head>
  <body>
    <div class="container">
      <div class="card custom-card p-5 rounded shadow mb-3 mt-2">
        <h2 class="text-center text-white">Simulasi Perhitungan Deposito</h2>
        <div class="d-flex justify-content-center">
          <img
            class="img-fluid rounded"
            src="/public/logo.jpg"
            alt="Logo Bank Jambi"
            width="20%"
          />
        </div>
        <h5 class="text-center fw-bolder mt-2 mb-3">Cabang Muara Bungo</h5>
        <!-- Baris 1 -->
        <div class="row">
          <div class="col-12 col-md-6 mb-3">
            <label for="nominal" class="text-dark fw-bolder mb-2 fw-bolder"
              >Nominal</label
            >
            <input
              type="text"
              id="nominal"
              name="nominal"
              class="form-control"
              placeholder="Input Nominal"
            />
          </div>

          <div class="col-12 col-md-6 mb-3">
            <label for="jenis" class="text-dark fw-bolder mb-2"
              >Tipe Deposito</label
            >
            <select name="jenis" id="jenis" class="form-control"></select>
          </div>
        </div>

        <!-- Baris 2 -->
        <div class="row">
          <div class="col-12 col-md-6 mb-3">
            <label for="tahun" class="text-dark fw-bolder mb-2"
              >Jangka Waktu</label
            >
            <select name="tahun" id="tahun" class="form-control">
              <option value="">Tenor</option>
            </select>
          </div>

          <div class="col-12 col-md-6 mb-3">
            <label for="persentase" class="text-dark fw-bolder mb-2 fw-bolder"
              >Suku Bunga (Jika Kosong Maka Otomatis 3.5%)</label
            >
            <input
              type="text"
              id="persentase"
              name="persentase"
              class="form-control"
              placeholder="Input Suku Bunga, Jika Kosong Maka Suku Bunga = 3.5%"
            />
          </div>
        </div>

        <!-- Baris 3 -->
        <div class="row">
          <div class="col-12 col-md-6 mb-3">
            <label for="bungaKotor" class="text-dark fw-bolder mb-2 fw-bolder"
              >Bunga Kotor</label
            >
            <input
              type="text"
              id="bungaKotor"
              name="bungaKotor"
              class="form-control"
              placeholder="Bunga Kotor"
              readonly
            />
          </div>

          <div class="col-12 col-md-6 mb-3">
            <label for="pajak" class="text-dark fw-bolder mb-2 fw-bolder"
              >Pajak</label
            >
            <input
              type="text"
              id="pajak"
              name="pajak"
              class="form-control"
              placeholder="Bunga Setelah Pajak"
              readonly
            />
          </div>
        </div>

        <!-- Baris 4 -->
        <div class="d-flex justify-content-center">
          <div class="col-12 col-md-12">
            <h4
              for="estimasiBersih"
              class="text-dark fw-bolder mb-2 text-center mt-3"
            >
              Estimasi Bersih Diterima
            </h4>
            <input
              type="text"
              id="estimasiBersih"
              name="estimasiBersih"
              class="form-control form-control-lg text-center"
              placeholder="Estimasi Bersih Diterima"
              readonly
            />
          </div>
        </div>

        <!-- Baris 5 -->
        <div class="d-flex justify-content-center" id="silahPrize"></div>

        <p class="text-secondary text-center mt-3">
          &copy; M. Zahran Yudha & Cipta Karya Teknologi Nusantara
        </p>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
